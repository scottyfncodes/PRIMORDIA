<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Primordia" />
    <meta name="theme-color" content="#03141f" />
    <meta name="description" content="PRIMORDIA — an evolutionary survival arcade. Begin as a single cell and become whatever survives." />
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="./icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>PRIMORDIA</title>
  </head>
  <body>
    <main id="app">
      <canvas id="game"></canvas>
      <div id="touch"></div>
      <div id="joy"><div id="joy-knob"></div></div>
      <div id="hud" hidden>
        <div class="hud-top">
          <div class="hud-left">
            <div class="era-line" id="era-chip">Era I · Primordial Life</div>
            <div class="org-line"><span id="form-name">Protocell</span></div>
            <div class="bars">
              <div class="bar energy" title="Energy"><span class="b-ic" data-icon="energy"></span><div class="b-track"><i id="energy-fill"></i></div></div>
              <div class="bar integrity" title="Integrity"><span class="b-ic" data-icon="integrity"></span><div class="b-track"><i id="hp-fill"></i></div></div>
              <div class="bar breath" id="breath-bar" title="Breath" hidden><span class="b-ic" data-icon="breath"></span><div class="b-track"><i id="breath-fill"></i></div></div>
            </div>
            <div class="growth">
              <span class="b-ic" data-icon="growth"></span>
              <div class="growth-bar"><i id="growth-fill"></i></div>
              <div class="pips" id="mut-pips" aria-label="Mutations toward the next era"></div>
            </div>
            <div id="growth-label">Growth → Era II</div>
          </div>
          <div class="hud-right">
            <button id="dna-btn" class="dna" aria-label="Evolve"><span class="dna-ic" data-icon="dna"></span><span id="dna-count">0</span><span class="dna-ready">Evolve</span></button>
            <button id="pause-btn" aria-label="Pause"><span></span><span></span></button>
          </div>
        </div>
        <div id="zone-label"></div>
        <div id="era-card"></div>
        <div id="scalebar"><i></i><span></span></div>
        <div id="toasts"></div>
        <div id="hint"></div>
        <div class="actions">
          <div id="ability-btns"></div>
          <button id="burst-btn" class="act big" aria-label="Burst"><span class="ic" data-icon="burst"></span><span class="lb">Burst</span></button>
        </div>
      </div>
      <div id="screens"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
