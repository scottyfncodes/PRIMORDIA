<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Primordia" />
    <meta name="theme-color" content="#03141f" />
    <meta name="description" content="PRIMORDIA — an evolutionary survival arcade. Begin as a single cell and become whatever survives." />
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="./icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>PRIMORDIA</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="touch"></div>
      <div id="joy"><div id="joy-knob"></div></div>
      <div id="hud" hidden>
        <div class="hud-top">
          <div class="hud-left">
            <div class="org-line"><span id="form-name">Protocell</span><span class="era-chip" id="era-chip">Era I</span></div>
            <div class="bars">
              <div class="bar energy" title="Energy"><span class="b-ic">⚡</span><div class="b-track"><i id="energy-fill"></i></div></div>
              <div class="bar integrity" title="Integrity"><span class="b-ic">◍</span><div class="b-track"><i id="hp-fill"></i></div></div>
            </div>
            <div class="growth"><div class="growth-bar"><i id="growth-fill"></i></div><span id="growth-label">Growth → Era II</span></div>
          </div>
          <div class="hud-right">
            <button id="dna-btn" class="dna" aria-label="Evolve"><span class="helix-ic"></span><span id="dna-count">0</span><span class="dna-ready">EVOLVE</span></button>
            <button id="pause-btn" aria-label="Pause"><span></span><span></span></button>
          </div>
        </div>
        <div id="zone-label"></div>
        <div id="toasts"></div>
        <div id="hint"></div>
        <div class="actions">
          <div id="ability-btns"></div>
          <button id="burst-btn" class="act big" aria-label="Burst"><span class="ic">⟫</span><span class="lb">Burst</span></button>
        </div>
      </div>
      <div id="screens"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
